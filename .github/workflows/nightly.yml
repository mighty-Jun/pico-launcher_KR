name: Build Pico Launcher

on:
  push:
    branches: ["korean_patch_galmuri"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["korean_patch_galmuri"]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  pico_launcher:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.16.0
    name: Build Pico Launcher
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run build script
        run: |
          make
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: |
            _pico/
            LAUNCHER.nds
          name: Pico_Launcher
